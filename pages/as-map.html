<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bitcoin node OS by autonomous system, map</title>
<style>
.viz-root {
  color-scheme: light;
  --surface-1: #fcfcfb; --page: #f9f9f7;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --land: #ecebe6; --land-hi: #dcdad2; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --unk: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --grid: #2c2c2a; --axis: #383835; --land: #262624; --land-hi: #34342f; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --unk: #898781;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1: #1a1a19; --page: #0d0d0d;
  --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --grid: #2c2c2a; --axis: #383835; --land: #262624; --land-hi: #34342f; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --unk: #898781;
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--page); color: var(--text-primary); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
header h1 { font-size: 18px; margin: 0 0 2px; }
header p { margin: 0; color: var(--text-secondary); }
header nav { margin-bottom: 6px; font-size: 13px; }
header nav a { color: var(--s1); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.tabs button { font: inherit; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary); padding: 5px 12px; cursor: pointer; }
.tabs button:first-child { border-radius: 8px 0 0 8px; }
.tabs button:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }
.tabs button[aria-pressed="true"] { color: var(--text-primary); font-weight: 600; background: var(--page); }
.bar label { color: var(--text-secondary); }
.bar label[hidden] { display: none; }
header a { color: inherit; }
.bar select, .bar button.reset { font: inherit; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--text-secondary); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }
main { flex: 1; display: flex; gap: 12px; min-height: 0; }
.stage { flex: 1; position: relative; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.stage svg { width: 100%; height: 100%; display: block; cursor: grab; }
.stage svg:active { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 8px; color: var(--muted); font-size: 12px; pointer-events: none; }
aside { width: 380px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow: auto; }
aside h2 { font-size: 16px; margin: 0 0 2px; }
aside .meta { color: var(--text-secondary); margin: 0 0 10px; }
aside h3 { font-size: 13px; color: var(--text-secondary); margin: 14px 0 6px; font-weight: 600; }
.list button > span:first-child { flex: 1; min-width: 0; }
.list button { display: flex; width: 100%; justify-content: space-between; gap: 8px; text-align: left; font: inherit; color: var(--text-primary); background: none; border: 0; border-bottom: 1px solid var(--grid); padding: 6px 2px; cursor: pointer; }
.list button:hover { background: var(--page); }
.list .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 1px; margin-top: 3px; }
.mini i { display: block; height: 100%; }
.osrow { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 8px; margin: 3px 0; font-variant-numeric: tabular-nums; }
.osrow .track { height: 10px; background: var(--grid); border-radius: 2px; }
.osrow .fill { height: 100%; border-radius: 2px; }
.osrow .v { text-align: right; color: var(--text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
td.ip { word-break: break-all; }
th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; position: sticky; top: -16px; background: var(--surface-1); }
td.r, th.r { text-align: right; }
.back { font: inherit; background: none; border: 0; color: var(--s1); cursor: pointer; padding: 0; margin-bottom: 8px; }
#tip { position: fixed; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.14); display: none; font-size: 13px; max-width: 280px; z-index: 5; }
#tip b { display: block; }
.os0 { fill: var(--s1); background: var(--s1); } .os1 { fill: var(--s2); background: var(--s2); } .os2 { fill: var(--s3); background: var(--s3); }
.os3 { fill: var(--s4); background: var(--s4); } .os4 { fill: var(--s5); background: var(--s5); } .os5 { fill: var(--s6); background: var(--s6); } .os6 { fill: var(--unk); background: var(--unk); }
.bubble path { stroke: var(--surface-1); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.bubble { cursor: pointer; }
.bubble:hover path, .bubble.sel path { stroke: var(--text-primary); stroke-width: 1.5px; }
.country { fill: var(--land); stroke: var(--surface-1); stroke-width: 0.6px; vector-effect: non-scaling-stroke; cursor: pointer; }
.country.has { fill: var(--land-hi); }
.country.sel { stroke: var(--text-primary); stroke-width: 1.2px; }
.clabel { fill: var(--text-primary); font-weight: 600; cursor: pointer; paint-order: stroke; stroke: var(--surface-1); }
.clabel tspan.n { fill: var(--muted); font-weight: 400; }
.region { fill: none; stroke: var(--grid); stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <nav><a href="./">← Scan overview</a> · <a href="versions.html">OS by node version</a></nav>
    <h1>Bitcoin node OS by autonomous system</h1>
    <p id="sub"></p>
  </header>
  <div class="bar">
    <label>Scan <select id="scan"></select></label>
    <div class="tabs"><button id="tCl" aria-pressed="true">Clusters</button><button id="tW" aria-pressed="false">World</button></div>
    <label id="placeWrap" hidden>Place by <select id="place"><option value="node" selected>Node location (DB-IP)</option><option value="as">AS registration</option></select></label>
    <label>Show ASes with at least <select id="minN"><option>1</option><option selected>2</option><option>5</option><option>20</option></select> nodes</label>
    <button class="reset" id="reset">Reset view</button>
    <div class="legend" id="legend"></div>
  </div>
  <main>
    <div class="stage"><svg id="svg"></svg><div class="hint">Scroll to zoom, drag to pan, click a bubble for its nodes. Bubble size = node count, slices = OS share (gray = Unknown).</div></div>
    <aside id="panel"></aside>
  </main>
  <div id="tip"></div>
</div>
<script src="vendor/d3.min.js"></script>
<script>
// Data comes from data/enriched/<scan>.json, built by data/enrich_scan.py
// in scripts/build_pages.sh; country shapes are Natural Earth 1:110m.
let D, GEO;
const OS = ["Linux", "Windows", "Other", "BSD", "macOS", "Android", "Unknown"], LABEL = o => o === "Other" ? "Other / device" : o;
const svg = d3.select("#svg"), root = svg.append("g"), panel = document.getElementById("panel"), tip = document.getElementById("tip");
const fmt = d3.format(",");
document.getElementById("legend").innerHTML = OS.map((o, i) => `<span style="--c:var(${["--s1","--s2","--s3","--s4","--s5","--s6","--unk"][i]})">${LABEL(o)}</span>`).join("");

// fallback positions for registries missing from the 110m map
const EXTRA = {AD:[1.5,42.5],AI:[-63.05,18.22],CW:[-68.99,12.17],EU:[-22,47],FO:[-6.9,62],GG:[-2.58,49.45],HK:[114.17,22.32],KN:[-62.75,17.3],LI:[9.55,47.15],MO:[113.55,22.2],MT:[14.4,35.9],RE:[55.5,-21.1],SG:[103.8,1.35],GP:[-61.55,16.25],IM:[-4.55,54.23],JE:[-2.13,49.21]};
const CNAME = {}, CNAME_EXTRA = ({AD:"Andorra",AI:"Anguilla",CW:"Curaçao",EU:"EU (no single country)",FO:"Faroe Islands",GG:"Guernsey",HK:"Hong Kong",KN:"Saint Kitts and Nevis",LI:"Liechtenstein",MO:"Macao",MT:"Malta",RE:"Réunion",SG:"Singapore",GP:"Guadeloupe",IM:"Isle of Man",JE:"Jersey",ZZ:"Unknown location"});

function setData(d) {
  D = d;
  document.getElementById("sub").innerHTML = `${fmt(D.reachable)} reachable nodes in ${D.scan}, ${fmt(D.ases.length)} ASes (iptoasn.com). Node location: <a href="https://db-ip.com">IP Geolocation by DB-IP</a> (CC BY 4.0), country level.`;
  D.ases.forEach(a => {
    a.n = a.nodes.length;
    const guessed = a.n - a.counts[6], sh = i => guessed ? a.counts[i] / guessed : 0;
    if (a.n < 5) a.cluster = "Small ASes";
    else if (a.counts[6] / a.n >= 0.5) a.cluster = "Mostly Unknown";
    else if (sh(5) >= 0.15) a.cluster = "Android-heavy";
    else if (sh(3) >= 0.15) a.cluster = "BSD-heavy";
    else if (sh(2) >= 0.15) a.cluster = "Device-heavy";
    else if (sh(1) + sh(4) >= 0.10) a.cluster = "Desktop mix";
    else if (sh(0) >= 0.90) a.cluster = "Linux 90%+";
    else a.cluster = "Mixed";
  });
  draw();
}
const CDESC = {"Linux 90%+": "90% or more of guessed nodes are Linux. Mostly hosting providers.",
  "Desktop mix": "Windows + macOS are 10% or more of guessed nodes. Mostly home ISPs.",
  "Mixed": "No single pattern stands out.",
  "BSD-heavy": "BSD is 15% or more. Likely the ISP's router answering, not the node.",
  "Android-heavy": "Android is 15% or more. Likely Linux VMs misread by nmap.",
  "Device-heavy": "Other/device is 15% or more. Likely a middlebox in front of the node.",
  "Mostly Unknown": "Half or more of the nodes got no OS guess.",
  "Small ASes": "Fewer than 5 nodes, too few to classify."};
const CLUSTERS = ["Linux 90%+", "Desktop mix", "Mixed", "BSD-heavy", "Android-heavy", "Device-heavy", "Mostly Unknown", "Small ASes"];

const pie = d3.pie().sort(null).value(d => d);
const radius = (n, k) => k * (2.5 + Math.sqrt(n) * 2.2);
let view = "clusters", minN = 2, selected = null, zoom, W, H, placeBy = "node", worldList = [], cur = [];

function bubbles(g, list) {
  const b = g.selectAll("g.bubble").data(list, d => d.asn).join("g").attr("class", "bubble")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .on("mousemove", (e, d) => showTip(e, d)).on("mouseleave", () => tip.style.display = "none")
    .on("click", (e, d) => { e.stopPropagation(); showAS(d); });
  b.selectAll("path").data(d => pie(d.counts).filter(s => s.value).map(s => ({s, r: d.r})))
    .join("path").attr("class", p => "os" + p.s.index)
    .attr("d", p => d3.arc().innerRadius(0).outerRadius(p.r)(p.s));
  return b;
}
function showTip(e, a) {
  const g = a.n - a.counts[6];
  const top = a.counts.map((c, i) => [c, i]).filter(([c, i]) => c && i < 6).sort((x, y) => y[0] - x[0]).slice(0, 3)
    .map(([c, i]) => `${LABEL(OS[i])} ${Math.round(c / g * 100)}%`).join(", ");
  tip.innerHTML = `<b>AS${a.asn} ${a.name}</b>${CNAME[a.cc] || a.cc} · ${a.n} node${a.n > 1 ? "s" : ""}<br>${top || "no OS guess"}${a.counts[6] ? `<br>Unknown: ${a.counts[6]}` : ""}`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
}

function osBars(counts) {
  const n = d3.sum(counts), g = n - counts[6];
  return OS.map((o, i) => {
    const den = i === 6 ? n : g, p = den ? counts[i] / den * 100 : 0;
    return `<div class="osrow"><span>${LABEL(o)}</span><div class="track"><div class="fill os${i}" style="width:${p}%"></div></div><span class="v">${counts[i]} · ${p.toFixed(0)}%</span></div>`;
  }).join("") + `<p class="meta" style="margin-top:6px">OS shares are of nodes with a guess; Unknown is of all nodes.</p>`;
}
const mini = c => `<div class="mini">${c.map((v, i) => v ? `<i class="os${i}" style="flex:${v}"></i>` : "").join("")}</div>`;
function asList(list) {
  cur = list;
  return `<div class="list">${list.map((a, i) => `<button data-i="${i}"><span>AS${a.asn} ${a.name}${mini(a.counts)}</span><span class="n">${a.n}</span></button>`).join("")}</div>`;
}
function wireList() {
  panel.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { const a = cur[b.dataset.i]; showAS(a); flyTo([a], 4); });
  panel.querySelectorAll("button[data-cl]").forEach(b => b.onclick = () => showCluster(b.dataset.cl));
  panel.querySelectorAll("button[data-cc]").forEach(b => b.onclick = () => showCountry(b.dataset.cc));
  const back = panel.querySelector(".back"); if (back) back.onclick = home;
}
const sumCounts = list => list.reduce((s, a) => s.map((v, i) => v + a.counts[i]), [0,0,0,0,0,0,0]);

function select(a) {
  selected = a;
  root.selectAll("g.bubble").classed("sel", d => d === a);
}
function showAS(a) {
  select(a);
  panel.innerHTML = `<button class="back">← Overview</button><h2>AS${a.asn} ${a.name}</h2>
    <p class="meta">${a.parent ? `${a.n} of its ${a.parent.n} nodes located in ${CNAME[a.cc] || a.cc} · AS registered in ${CNAME[a.regcc] || a.regcc}`
      : `Registered in ${CNAME[a.cc] || a.cc} · ${a.n} reachable node${a.n > 1 ? "s" : ""}`} · cluster: ${a.cluster}</p>${osBars(a.counts)}
    <h3>Nodes</h3><table><tr><th>IP</th><th class="r">Port</th><th>OS</th><th class="r">Acc.</th><th class="r">Loc.</th></tr>
    ${a.nodes.map(([ip, port, os, acc, loc]) => `<tr><td class="ip">${ip}</td><td class="r">${port}</td><td>${OS[os]}</td><td class="r">${acc || ""}</td><td class="r" title="${CNAME[loc] || loc}">${loc}</td></tr>`).join("")}</table>`;
  wireList();
}
function showCluster(c) {
  const list = visible().filter(a => a.cluster === c);
  panel.innerHTML = `<button class="back">← Overview</button><h2>${c}</h2><p class="meta">${CDESC[c]}</p><p class="meta">${list.length} ASes · ${fmt(d3.sum(list, a => a.n))} nodes</p>${osBars(sumCounts(list))}<h3>ASes</h3>${asList(list)}`;
  wireList(); select(null);
  if (view !== "clusters") setView("clusters");
  flyTo(list);
}
function showCountry(cc) {
  const list = worldList.filter(a => a.cc === cc);
  root.selectAll("path.country").classed("sel", f => f.properties.cc === cc);
  panel.innerHTML = `<button class="back">← Overview</button><h2>${CNAME[cc] || cc}</h2><p class="meta">${placeBy === "node" ? "Nodes located here, by AS" : "ASes registered here"}</p><p class="meta">${list.length} ASes · ${fmt(d3.sum(list, a => a.n))} nodes</p>${osBars(sumCounts(list))}<h3>ASes</h3>${asList(list)}`;
  wireList(); select(null);
  flyTo(list);
}
function home() {
  select(null);
  root.selectAll("path.country").classed("sel", false);
  const list = view === "clusters" ? visible() : worldList;
  if (view === "clusters") {
    panel.innerHTML = `<h2>Clusters</h2><p class="meta">ASes grouped by their OS mix (5+ nodes). Click one to visit it.</p><div class="list">${CLUSTERS.map(c => {
      const l = list.filter(a => a.cluster === c); if (!l.length) return "";
      return `<button data-cl="${c}"><span>${c}${mini(sumCounts(l))}</span><span class="n">${l.length} AS · ${fmt(d3.sum(l, a => a.n))}</span></button>`; }).join("")}</div>`;
  } else {
    const by = d3.rollups(list, l => [l.length, d3.sum(l, a => a.n), sumCounts(l)], a => a.cc).sort((x, y) => y[1][1] - x[1][1]);
    panel.innerHTML = `<h2>Countries</h2><p class="meta">${placeBy === "node" ? "By node location (DB-IP). An AS with nodes in several countries gets one bubble per country." : "By AS registration country, not where nodes are."} Click one to visit it.</p><div class="list">${by.map(([cc, [k, n, c]]) =>
      `<button data-cc="${cc}"><span>${CNAME[cc] || cc}${mini(c)}</span><span class="n">${k} AS · ${fmt(n)}</span></button>`).join("")}</div>`;
  }
  wireList();
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity);
}
function flyTo(list, maxK = 8) {
  if (!list.length) return;
  const x0 = d3.min(list, a => a.x - a.r), x1 = d3.max(list, a => a.x + a.r);
  const y0 = d3.min(list, a => a.y - a.r), y1 = d3.max(list, a => a.y + a.r);
  const k = Math.min(maxK, 0.85 / Math.max((x1 - x0) / W, (y1 - y0) / H));
  svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2));
}

const visible = () => D.ases.filter(a => a.n >= minN);

function drawClusters() {
  root.selectAll("*").remove();
  const list = visible();
  // pack each cluster on its own, then shelf-lay the clusters in rows with room for a label
  const groups = CLUSTERS.map(name => {
    const kids = list.filter(a => a.cluster === name).map(a => ({a, r: radius(a.n, 1) + 0.8}));
    if (!kids.length) return null;
    d3.packSiblings(kids); const e = d3.packEnclose(kids);
    kids.forEach(k => { k.x -= e.x; k.y -= e.y; });
    return {name, kids, R: e.r, sc: 1, lw: (name.length + 5) * 7.8};
  }).filter(Boolean);
  const LABEL_H = 30, GAP = 28;
  function layout(sc) {
    const rows = []; let row = [], w = 0;
    for (const g of groups) {
      const d = Math.max(2 * g.R * sc, g.lw);
      if (row.length && w + GAP + d > W - 20) { rows.push(row); row = []; w = 0; }
      w += (row.length ? GAP : 0) + d; row.push(g);
    }
    rows.push(row);
    const hs = rows.map(r => LABEL_H + d3.max(r, g => 2 * g.R * sc));
    return {rows, hs, total: d3.sum(hs) + GAP * (rows.length - 1)};
  }
  let sc = 1, L = layout(sc);
  while (L.total > H - 20 && sc > 0.05) { sc *= 0.97; L = layout(sc); }
  let y = (H - L.total) / 2;
  L.rows.forEach((r, i) => {
    const w = d3.sum(r, g => Math.max(2 * g.R * sc, g.lw)) + GAP * (r.length - 1);
    let x = (W - w) / 2;
    const cy = y + LABEL_H + L.hs[i] / 2 - LABEL_H / 2;
    r.forEach(g => { const d = Math.max(2 * g.R * sc, g.lw); g.cx = x + d / 2; g.cy = cy; x += d + GAP; });
    y += L.hs[i] + GAP;
  });
  groups.forEach(g => g.sc = sc);
  groups.forEach(g => g.kids.forEach(k => { k.a.x = g.cx + k.x * sc; k.a.y = g.cy + k.y * sc; k.a.r = (k.r - 0.8) * sc; }));
  root.append("g").selectAll("circle").data(groups).join("circle").attr("class", "region")
    .attr("cx", g => g.cx).attr("cy", g => g.cy).attr("r", g => g.R * sc + 5);
  bubbles(root.append("g"), list);
  root.append("g").selectAll("text").data(groups).join("text").attr("class", "clabel")
    .attr("x", g => g.cx).attr("y", g => g.cy - g.R * sc - 12).attr("font-size", 14).attr("stroke-width", 4).attr("text-anchor", "middle")
    .html(g => `${g.name} <tspan class="n">(${g.kids.length})</tspan>`).on("click", (e, g) => showCluster(g.name));
}

function drawWorld() {
  root.selectAll("*").remove();
  const proj = d3.geoNaturalEarth1().fitExtent([[10, 10], [W - 10, H - 10]], {type: "Sphere"});
  const path = d3.geoPath(proj);
  worldList = placeBy === "as" ? visible() : visible().flatMap(a =>
    d3.groups(a.nodes, n => n[4]).map(([cc, nodes]) => ({asn: a.asn, name: a.name, regcc: a.cc, cc, nodes, n: nodes.length, cluster: a.cluster, parent: a,
      counts: nodes.reduce((c, n) => (c[n[2]]++, c), [0,0,0,0,0,0,0])})));
  const list = worldList, ccs = new Set(list.map(a => a.cc));
  root.append("g").selectAll("path").data(GEO.features).join("path")
    .attr("class", f => "country" + (ccs.has(f.properties.cc) ? " has" : "")).attr("d", path)
    .on("click", (e, f) => { if (ccs.has(f.properties.cc)) showCountry(f.properties.cc); });
  const cent = {};
  GEO.features.forEach(f => {
    let g = f.geometry;
    if (g.type === "MultiPolygon") { // centroid of the largest part, so overseas territories don't pull it
      const big = g.coordinates.reduce((m, p) => { const ar = d3.geoArea({type: "Polygon", coordinates: p}); return ar > m[0] ? [ar, p] : m; }, [0, null])[1];
      g = {type: "Polygon", coordinates: big};
    }
    cent[f.properties.cc] = proj(d3.geoCentroid(g));
  });
  for (const [cc, ll] of Object.entries(EXTRA)) cent[cc] = proj(ll);
  list.forEach(a => { a.r = radius(a.n, 0.4); const c = cent[a.cc] || proj([0, -60]); a.cx = c[0]; a.cy = c[1]; a.x = c[0] + Math.random() * 4; a.y = c[1] + Math.random() * 4; });
  const sim = d3.forceSimulation(list).stop()
    .force("x", d3.forceX(a => a.cx).strength(0.15)).force("y", d3.forceY(a => a.cy).strength(0.15))
    .force("c", d3.forceCollide(a => a.r + 0.6).iterations(3));
  for (let i = 0; i < 300; i++) sim.tick();
  bubbles(root.append("g"), list);
}

function draw() {
  const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height;
  (view === "clusters" ? drawClusters : drawWorld)();
  home();
}
function setView(v) {
  view = v;
  document.getElementById("tCl").setAttribute("aria-pressed", v === "clusters");
  document.getElementById("tW").setAttribute("aria-pressed", v === "world");
  document.getElementById("placeWrap").hidden = v !== "world";
  root.attr("transform", null); svg.call(zoom.transform, d3.zoomIdentity);
  const r = svg.node().getBoundingClientRect(); W = r.width; H = r.height;
  (view === "clusters" ? drawClusters : drawWorld)();
}
zoom = d3.zoom().scaleExtent([0.5, 60]).on("zoom", e => {
  root.attr("transform", e.transform);
  const k = e.transform.k; // keep cluster labels at screen size
  root.selectAll("text.clabel").attr("font-size", 14 / k).attr("stroke-width", 4 / k).attr("y", g => g.cy - g.R * g.sc - 12 / k);
});
svg.call(zoom).on("click", () => {});
document.getElementById("tCl").onclick = () => { setView("clusters"); home(); };
document.getElementById("tW").onclick = () => { setView("world"); home(); };
document.getElementById("reset").onclick = home;
document.getElementById("place").onchange = e => { placeBy = e.target.value; setView("world"); home(); };
document.getElementById("minN").onchange = e => { minN = +e.target.value; draw(); };
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => D && draw(), 200); });

const SCAN_RE = /^scan-\d{4}-\d{2}-\d{2}\.csv$/; // -legacy scans are skipped, as on the overview
(async () => {
  try {
    GEO = await (await fetch("vendor/countries.json")).json();
    Object.assign(CNAME, Object.fromEntries(GEO.features.map(f => [f.properties.cc, f.properties.name])), CNAME_EXTRA);
    const files = ((await (await fetch("data/index.json")).json()).files || []).filter(f => SCAN_RE.test(f)).sort();
    const sel = document.getElementById("scan"), want = new URLSearchParams(location.search).get("scan");
    sel.innerHTML = files.map(f => `<option>${f.slice(0, -4)}</option>`).join("");
    sel.value = files.includes(want + ".csv") ? want : files.at(-1).slice(0, -4);
    const load = async () => {
      history.replaceState(null, "", "?scan=" + sel.value);
      const r = await fetch(`data/enriched/${sel.value}.json`);
      if (!r.ok) throw new Error(`Could not load ${sel.value} (${r.status}).`);
      setData(await r.json());
    };
    sel.onchange = () => load().catch(fail);
    await load();
  } catch (e) { fail(e); }
})();
function fail(e) { panel.innerHTML = `<h2>Could not load the data</h2><p class="meta">${e.message}</p>`; }
</script>
